<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/game.css">

    <title>Web Prog Evolutions</title>
</head>
<body>
<div id="screen-wrapper">
    <header id="header"><h1>WEB PROG EVOLUTION</h1></header>
    <main id="game-container">
        <section id="control">
            <div id="info">
                <span class="label">Name</span>
                <span class="value" id="info-name">: Unknown</span>

                <span class="label">Difficulty</span>
                <span class="value" id="info-difficulty">: Unknown</span>

                <span class="label">Time</span>
                <span class="value" id="info-time">: ##:##</span>

                <span class="label">Score</span>
                <span class="value" id="info-score">: ######</span>
            </div>

            <button id="btn-draw">Draw</button>
        </section>
        <section id="points"></section>
        <section id="board"></section>
        <aside id="leaderboard">
            <h2>Leaderboard</h2>
        </aside>
    </main>
</div>

<noscript>
    <style>
        body {
            background-color: #000;
            color: #fff;
            text-align: center;
        }
    </style>
    <h1>JavaScript is disabled</h1>
    <p>Please enable JavaScript to view this page.</p>
</noscript>

<!-- TODO Minified scripts are avg. 50% smaller, and therefore load faster -->
<script src="scripts/data/evolutions.min.js"></script>
<script src="scripts/util/map2d.js"></script>
<script src="scripts/util/timer.js"></script>
<script src="scripts/util/dragdrop.js"></script>
<script src="scripts/util/gameplay.js"></script>
<script src="scripts/game.js"></script>
<script src="scripts/initUi.js"></script>
</body>
</html>
