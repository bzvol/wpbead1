<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/index.css">

    <title>Web Prog Evolutions</title>
</head>
<body>
<main class="ctr">
    <div id="start-screen">
        <h1>MERGE JS TERMINAL</h1>
        <form id="start-form" class="border-blue br-2" action="game.html" method="get">
            <label for="name">NAME:</label>
            <input type="text" name="name" id="name"
                   placeholder="NAME" value="PLAYER 1"
                   maxlength="8" autocomplete="off" required>

            <label for="difficulty">DIFFICULTY:</label>
            <div class="select-wrapper">
                <select name="difficulty" id="difficulty" required></select>
            </div>

            <button type="submit">PLAY</button>
        </form>
    </div>
</main>

<noscript>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
        }
    </style>
    <h1>JavaScript is disabled</h1>
    <p>Please enable JavaScript to view this page.</p>
</noscript>

<!-- I tried to use ES6 `type="module"` for scripts, however
     then you can only view the page on a server, as
     modules do not support `file://` protocol. -->
<script src="scripts/data/evolutions.min.js"></script>
<script src="scripts/index.js"></script>
</body>
</html>
